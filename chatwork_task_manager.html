<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatWork タスク追加</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
    --border: #2e3350; --accent: #4f8ef7; --accent2: #7c5cfc;
    --success: #34d399; --error: #f87171;
    --text: #e8eaf6; --muted: #6b7280;
    --font: 'Noto Sans JP', sans-serif; --mono: 'DM Mono', monospace;
  }
  body {
    font-family: var(--font); background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 32px 16px;
  }
  .header { text-align: center; margin-bottom: 36px; }
  .header h1 {
    font-size: 1.6rem; font-weight: 700; letter-spacing: -0.03em;
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .header p { color: var(--muted); font-size: 0.82rem; margin-top: 6px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px; width: 100%; max-width: 560px; margin-bottom: 20px;
  }
  .section-title {
    font-size: 0.7rem; font-family: var(--mono); letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 14px;
  }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; margin-top: 16px; }
  label:first-of-type { margin-top: 0; }
  input[type="text"], input[type="date"], select, textarea, input[type="password"] {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: var(--font);
    font-size: 0.9rem; padding: 10px 14px; outline: none; transition: border-color 0.2s;
  }
  input[type="password"] { font-family: var(--mono); font-size: 0.85rem; letter-spacing: 0.05em; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  select option { background: var(--surface2); }
  textarea { resize: vertical; min-height: 80px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; padding: 11px 20px; border-radius: 8px; border: none;
    font-family: var(--font); font-size: 0.88rem; font-weight: 500;
    cursor: pointer; transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    color: #fff; width: 100%; margin-top: 20px; font-size: 0.95rem; padding: 13px;
  }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .tag { display: inline-block; font-size: 0.72rem; font-family: var(--mono); padding: 2px 8px; border-radius: 4px; margin-left: 8px; vertical-align: middle; }
  .tag-ok { background: rgba(52,211,153,0.15); color: var(--success); }
  .tag-err { background: rgba(248,113,113,0.15); color: var(--error); }
  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 22px; font-size: 0.88rem;
    opacity: 0; transition: opacity 0.3s, transform 0.3s;
    pointer-events: none; z-index: 100; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--success); color: var(--success); }
  .toast.error { border-color: var(--error); color: var(--error); }
  .member-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 5px 12px; font-size: 0.78rem;
    cursor: pointer; transition: border-color 0.15s, background 0.15s; user-select: none;
  }
  .chip.selected { border-color: var(--accent); background: rgba(79,142,247,0.12); color: var(--accent); }
  .chip .avatar {
    width: 20px; height: 20px; border-radius: 50%;
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 0.6rem; font-weight: 700; color: #fff;
  }
  .spinner {
    width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.2);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  hr.divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .info-box {
    background: rgba(79,142,247,0.08); border: 1px solid rgba(79,142,247,0.2);
    border-radius: 8px; padding: 10px 14px; font-size: 0.78rem;
    color: var(--muted); margin-top: 10px; line-height: 1.6;
  }
  #step2 { display: none; }
</style>
</head>
<body>

<div class="header">
  <h1>⚡ ChatWork タスク追加</h1>
  <p>APIトークンを設定してルームとメンバーを読み込みます</p>
</div>

<div class="card" id="step1">
  <div class="section-title">Step 1 — API設定</div>
  <label>ChatWork APIトークン</label>
  <input type="password" id="apiToken" placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" />
  <div class="info-box">
    ChatWork → 右上アイコン → 「サービス連携」→「APIトークン」から取得できます
  </div>
  <button class="btn btn-primary" id="btnLoad" onclick="loadRooms()">
    ルームとメンバーを読み込む
  </button>
</div>

<div class="card" id="step2">
  <div class="section-title">Step 2 — タスク追加</div>

  <label>ルーム <span id="roomStatus"></span></label>
  <select id="roomSelect" onchange="loadMembers()">
    <option value="">ルームを選択...</option>
  </select>

  <label>担当者（複数選択可）</label>
  <div id="memberChips" class="member-chips">
    <span style="color:var(--muted);font-size:0.78rem;">ルームを選択するとメンバーが表示されます</span>
  </div>

  <hr class="divider">

  <label>タスク内容</label>
  <textarea id="taskBody" placeholder="例：〇〇の資料を作成して提出する"></textarea>

  <label>期限</label>
  <input type="date" id="taskDue" />

  <button class="btn btn-primary" id="btnAdd" onclick="addTask()" disabled>
    タスクを追加する
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
  const CW = 'https://api.chatwork.com/v2';
  let apiToken = '';
  let selectedMembers = [];

  function showToast(msg, type='success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => { t.className = 'toast'; }, 3500);
  }

  async function cwFetch(path, method='GET', body=null) {
    const opts = {
      method,
      headers: { 'X-ChatWorkToken': apiToken }
    };
    if (body) {
      opts.headers['Content-Type'] = 'application/x-www-form-urlencoded';
      opts.body = new URLSearchParams(body).toString();
    }
    const res = await fetch(`${CW}${path}`, opts);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  async function loadRooms() {
    apiToken = document.getElementById('apiToken').value.trim();
    if (!apiToken) { showToast('APIトークンを入力してください', 'error'); return; }

    const btn = document.getElementById('btnLoad');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> 読込中...';

    try {
      const rooms = await cwFetch('/rooms');
      const sel = document.getElementById('roomSelect');
      sel.innerHTML = '<option value="">ルームを選択...</option>';
      rooms
        .filter(r => r.role !== 'readonly')
        .sort((a,b) => a.name.localeCompare(b.name, 'ja'))
        .forEach(r => {
          const o = document.createElement('option');
          o.value = r.room_id;
          o.textContent = r.name;
          sel.appendChild(o);
        });
      document.getElementById('step2').style.display = 'block';
      document.getElementById('roomStatus').innerHTML = `<span class="tag tag-ok">✓ ${rooms.length}件</span>`;
      showToast(`${rooms.length}件のルームを読み込みました`);
    } catch(e) {
      showToast('読み込み失敗。APIトークンを確認してください', 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'ルームを再読み込み';
    }
  }

  async function loadMembers() {
    const roomId = document.getElementById('roomSelect').value;
    if (!roomId) return;
    selectedMembers = [];
    document.getElementById('memberChips').innerHTML = '<span style="color:var(--muted);font-size:0.78rem;"><span class="spinner"></span> 読込中...</span>';

    try {
      const members = await cwFetch(`/rooms/${roomId}/members`);
      const chips = document.getElementById('memberChips');
      chips.innerHTML = '';
      members.forEach(m => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.dataset.id = m.account_id;
        const initial = (m.name || '?')[0].toUpperCase();
        chip.innerHTML = `<div class="avatar">${initial}</div>${m.name}`;
        chip.addEventListener('click', () => toggleMember(chip, m.account_id));
        chips.appendChild(chip);
      });
    } catch(e) {
      document.getElementById('memberChips').innerHTML = '<span style="color:var(--error);font-size:0.78rem;">メンバー取得失敗</span>';
    }
    updateAddBtn();
  }

  function toggleMember(chip, id) {
    const idx = selectedMembers.indexOf(id);
    if (idx === -1) { selectedMembers.push(id); chip.classList.add('selected'); }
    else { selectedMembers.splice(idx, 1); chip.classList.remove('selected'); }
    updateAddBtn();
  }

  function updateAddBtn() {
    const roomId = document.getElementById('roomSelect').value;
    const body = document.getElementById('taskBody').value.trim();
    document.getElementById('btnAdd').disabled = !(roomId && body);
  }

  document.getElementById('taskBody').addEventListener('input', updateAddBtn);

  async function addTask() {
    const roomId = document.getElementById('roomSelect').value;
    const body = document.getElementById('taskBody').value.trim();
    const dueStr = document.getElementById('taskDue').value;
    if (!body) { showToast('タスク内容を入力してください', 'error'); return; }

    const payload = { body };
    if (selectedMembers.length > 0) payload.to_ids = selectedMembers.join(',');
    if (dueStr) {
      payload.limit = Math.floor(new Date(dueStr).getTime() / 1000);
      payload.limit_type = 'date';
    }

    const btn = document.getElementById('btnAdd');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> 追加中...';

    try {
      const res = await cwFetch(`/rooms/${roomId}/tasks`, 'POST', payload);
      showToast(`✓ タスクを追加しました（ID: ${res.task_ids?.join(', ')}）`);
      document.getElementById('taskBody').value = '';
      document.getElementById('taskDue').value = '';
      selectedMembers = [];
      document.querySelectorAll('.chip.selected').forEach(c => c.classList.remove('selected'));
    } catch(e) {
      showToast('タスク追加に失敗しました', 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'タスクを追加する';
    }
  }
</script>
</body>
</html>
